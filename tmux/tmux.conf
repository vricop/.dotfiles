# Minimal theme
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
green_lime="#b3df72"

set -g mode-keys vi
set -g base-index  1
set -g renumber-windows off
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g status-left-length 50
set -g status-left "#S"
set -g status-right ""
set -g window-status-current-style "fg=green bold"
set -g allow-rename off
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold]    #S #{fg:${gray_light},nobold}"
set -g window-status-current-format "#[fg=${green_lime},bold] 󰓩  #I:#W"
set -g window-status-format "#[fg=${gray_light}]  󰓩  #I:#W"
set -g default-command "exec $SHELL"
set -g update-environment "PWD"
set-hook -g after-select-pane 'set-option -t : default-path "#{pane_current_path}"'
set-hook -g after-select-window 'set-option -t : default-path "#{pane_current_path}"'

# set -g default-terminal "tmux-256color"
# set -as terminal-features 'tmux-256color:RGB'

bind r source-file ~/.config/tmux/tmux.conf\; \
display-message "Config reloaded"

# Vim motions for panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use pbcopy for copying to system clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
set-option -g focus-events on

unbind M-u
bind C-I run-shell ~/.tmux/plugins/tpm/bin/clean_plugins
bind g popup -E -w 100% -h 100% -xC -yC lazygit
bind R popup -E -w 100% -h 100% -d "#{pane_current_path}" 'exec serpl'
bind e popup -E -w 100% -h 100% -xC -yC spf
